<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Список дел Pro</title>
    
    <!-- НАСТРОЙКИ PWA -->
    <meta name="theme-color" content="#8b5cf6">
    <link rel="manifest" href="manifest.json">
    <!-- Конец настроек PWA -->

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0b0f19; --card: rgba(30, 41, 59, 0.7); --primary: #8b5cf6; --accent: #22d3ee;
            --text: #f8fafc; --text-dim: #94a3b8; --danger: #ef4444; --success: #10b981; --border: rgba(255,255,255,0.08);
        }
        body.light-mode { 
            --bg: #f8fafc; --card: rgba(255, 255, 255, 0.8); --text: #0f172a; --text-dim: #64748b; --border: rgba(0,0,0,0.05); 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Manrope', sans-serif; }

        body {
            background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh;
            padding: 20px 15px 80px 15px; overflow-x: hidden; transition: background-color 0.4s, color 0.4s; position: relative;
        }
        body::before, body::after { content: ''; position: fixed; width: 50vw; height: 50vw; z-index: -1; pointer-events: none; }
        body::before { top: -10%; left: -10%; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%); }
        body::after { bottom: -10%; right: -10%; background: radial-gradient(circle, rgba(34, 211, 238, 0.1) 0%, transparent 70%); }

        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 24px; z-index: 1; }

        header { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; background: linear-gradient(135deg, #8b5cf6, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .date { font-size: 0.9rem; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .action-btn, .theme-toggle {
            background: var(--card); border: 1px solid var(--border); width: 45px; height: 45px; border-radius: 50%;
            font-size: 1.2rem; cursor: pointer; color: var(--text); display: flex; justify-content: center; align-items: center; 
            transition: all 0.3s; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .action-btn:active, .theme-toggle:active { transform: scale(0.9); }
        .action-btn:hover, .theme-toggle:hover { border-color: var(--primary); }

        .calendar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .calendar::-webkit-scrollbar { display: none; }
        .day-btn {
            min-width: 65px; padding: 12px 0; border-radius: 20px; background: var(--card); border: 1px solid var(--border);
            color: var(--text-dim); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; 
            transition: all 0.3s; backdrop-filter: blur(10px);
        }
        .day-btn .day-name { font-size: 0.75rem; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
        .day-btn .day-num { font-size: 1.3rem; font-weight: 800; color: var(--text); }
        .day-btn.active { background: var(--primary); border-color: var(--primary); box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4); transform: translateY(-2px); }
        .day-btn.active .day-name, .day-btn.active .day-num { color: white; }

        .progress-container { background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid var(--border); backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .progress-header { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-dim); margin-bottom: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; transition: color 0.3s; }
        .progress-header.completed-text { color: var(--success); }
        .progress-bar-bg { height: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--primary)); width: 0%; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 10px; box-shadow: 0 0 15px rgba(139, 92, 246, 0.6); }

        .input-container { display: flex; flex-direction: column; gap: 12px; background: var(--card); padding: 20px; border-radius: 24px; border: 1px solid var(--border); backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .input-row { display: flex; gap: 10px; }
        
        input[type="text"], input[type="time"] { 
            background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.2); 
            color: var(--text); font-size: 16px; font-weight: 600; outline: none; transition: 0.3s; font-family: 'Manrope', sans-serif;
        }
        body.light-mode input[type="text"], body.light-mode input[type="time"] {
            background: #ffffff; border: 1px solid rgba(0,0,0,0.15); box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        input[type="text"] { flex: 1; padding: 15px; border-radius: 16px; }
        input[type="time"] { padding: 12px; border-radius: 16px; }
        
        input[type="text"]:focus, input[type="time"]:focus { 
            border-color: var(--primary); background: rgba(255, 255, 255, 0.2); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3); 
        }
        body.light-mode input[type="text"]:focus, body.light-mode input[type="time"]:focus { background: #ffffff; }

        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        body.light-mode input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0); }

        .color-picker { display: flex; gap: 12px; justify-content: center; margin-top: 5px; }
        .color-dot {
            width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
            transition: all 0.2s; display: flex; justify-content: center; align-items: center;
        }
        .color-dot.active { border-color: #ffffff; transform: scale(1.15); box-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .color-dot.active::after { content: '✓'; color: white; font-size: 14px; font-weight: 900; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

        .btn-add { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary), var(--accent)); border: none; border-radius: 16px; color: white; font-size: 1.1rem; font-weight: 800; cursor: pointer; box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3); transition: 0.3s; }
        .btn-add:active { transform: scale(0.96); }

        .habits-list { display: flex; flex-direction: column; gap: 14px; padding-bottom: 20px; min-height: 200px; }
        .habit-card { position: relative; border-radius: 20px; background: var(--danger); overflow: hidden; animation: fadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .delete-layer { position: absolute; top: 0; right: 0; bottom: 0; padding: 0 30px; display: flex; align-items: center; justify-content: flex-end; color: white; font-weight: 800; font-size: 0.9rem; z-index: 1; }
        
        .habit-front { 
            position: relative; background: var(--card); padding: 18px 20px; border-radius: 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease; 
            z-index: 2; touch-action: pan-y; backdrop-filter: blur(15px); 
            border: 1px solid var(--border); border-left: 6px solid var(--custom-color, var(--border)); overflow: hidden;
        }

        .habit-front::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--custom-color, #8b5cf6), transparent);
            opacity: 0.3; animation: shine 4s infinite linear; pointer-events: none; z-index: 0;
        }
        @keyframes shine { 0% { left: -100%; } 100% { left: 100%; } }
        
        .habit-content { display: flex; flex-direction: column; gap: 6px; flex: 1; position: relative; z-index: 2; }
        .habit-title-row { display: flex; align-items: center; gap: 15px; }
        .habit-text { font-weight: 800; font-size: 1.1rem; transition: 0.3s; word-break: break-word; }
        .habit-time { font-size: 0.85rem; color: var(--text-dim); font-weight: 800; display: flex; align-items: center; gap: 5px; margin-left: 43px; }

        .habit-card.overdue .habit-front::before, .habit-card.completed .habit-front::before { display: none; }

        .habit-card.overdue .habit-front { background: rgba(239, 68, 68, 0.15) !important; border-color: rgba(239, 68, 68, 0.4) !important; border-left-color: var(--danger) !important; }
        body.light-mode .habit-card.overdue .habit-front { background: rgba(254, 226, 226, 0.8) !important; border-color: rgba(239, 68, 68, 0.3) !important; }
        .habit-card.overdue .habit-text { color: #fca5a5; }
        body.light-mode .habit-card.overdue .habit-text { color: #b91c1c; }
        .habit-time.overdue { color: #ef4444 !important; }

        .habit-card.completed .habit-front { background: var(--success) !important; border: 1px solid var(--success) !important; border-left: 6px solid var(--success) !important; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2); }
        .habit-card.completed .habit-text, .habit-card.completed .habit-time { text-decoration: line-through; color: rgba(255, 255, 255, 0.8) !important; }

        .check-btn { width: 28px; height: 28px; min-width: 28px; border-radius: 50%; border: 2px solid var(--text-dim); background: transparent; cursor: pointer; transition: all 0.3s; display: flex; justify-content: center; align-items: center; z-index: 3; }
        .habit-card.completed .check-btn { background: #ffffff; border-color: #ffffff; transform: scale(1.1); }
        .habit-card.completed .check-btn::after { content: '✓'; color: var(--success); font-size: 16px; font-weight: 900; }

        .card-actions { display: flex; gap: 8px; z-index: 3; align-items: center; }
        .btn-icon { background: transparent; border: none; font-size: 1.1rem; cursor: pointer; transition: 0.3s; padding: 5px; opacity: 0.6; }
        .btn-icon:hover { opacity: 1; transform: scale(1.15); }
        .btn-icon.edit:hover { color: var(--accent); }
        .btn-icon.delete:hover { color: var(--danger); }
        @media (max-width: 768px) { .btn-icon { opacity: 0.9; padding: 8px; } }

        .empty-state { text-align: center; color: var(--text-dim); margin-top: 30px; font-size: 0.95rem; font-weight: 600; }
        .footer-hint { text-align: center; color: var(--text-dim); font-size: 0.85rem; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 8px; }

        .popup-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 20px; }
        .popup-overlay.show { opacity: 1; pointer-events: all; }
        .popup-box { background: var(--bg); padding: 30px; border-radius: 30px; width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border); box-shadow: 0 0 50px rgba(0,0,0,0.5); transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .popup-overlay.show .popup-box { transform: scale(1); }
        
        .alarm-icon { font-size: 4rem; margin-bottom: 15px; animation: ring 1s infinite; display: inline-block; }
        .popup-box h2 { color: var(--primary); margin-bottom: 15px; font-size: 1.6rem; font-weight: 800; }
        
        .edit-inputs { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .edit-actions { display: flex; gap: 10px; }
        .btn-save, .btn-cancel, .btn-stop { border: none; padding: 15px; border-radius: 16px; font-size: 1rem; font-weight: 800; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-save { background: linear-gradient(135deg, var(--success), var(--accent)); color: white; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: var(--text); }
        .btn-stop { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; }
        .btn-save:active, .btn-cancel:active, .btn-stop:active { transform: scale(0.95); }

        @keyframes ring { 0% { transform: rotate(0); } 25% { transform: rotate(15deg); } 50% { transform: rotate(-15deg); } 75% { transform: rotate(10deg); } 100% { transform: rotate(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    </style>
</head>
<body>

    <div class="popup-overlay" id="alarmOverlay">
        <div class="popup-box">
            <span class="alarm-icon">⏰</span>
            <h2>Пора действовать!</h2>
            <p id="alarmTaskText" style="font-size: 1.2rem; font-weight: 800; margin-bottom: 30px;">Задача</p>
            <button class="btn-stop" id="stopAlarmBtn">Я сделал это (Стоп)</button>
        </div>
    </div>

    <div class="popup-overlay" id="editOverlay">
        <div class="popup-box">
            <h2>Редактировать</h2>
            <div class="edit-inputs">
                <input type="text" id="editTextInput" placeholder="Текст задачи">
                <input type="time" id="editTimeInput">
                <div class="color-picker" id="editColorPicker">
                    <div class="color-dot" style="background: #8b5cf6;" data-color="#8b5cf6"></div>
                    <div class="color-dot" style="background: #22d3ee;" data-color="#22d3ee"></div>
                    <div class="color-dot" style="background: #f59e0b;" data-color="#f59e0b"></div>
                    <div class="color-dot" style="background: #ec4899;" data-color="#ec4899"></div>
                    <div class="color-dot" style="background: #3b82f6;" data-color="#3b82f6"></div>
                </div>
            </div>
            <div class="edit-actions">
                <button class="btn-cancel" id="cancelEditBtn">Отмена</button>
                <button class="btn-save" id="saveEditBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <header>
            <div class="logo-date">
                <h1>Список дел</h1>
                <div class="date" id="currentDateLabel"></div>
            </div>
            <div class="header-actions">
                <button class="action-btn" id="exportBtn" title="Скачать бэкап">💾</button>
                <label class="action-btn" title="Загрузить бэкап">
                    📂
                    <input type="file" id="importBtn" accept=".json" style="display: none;">
                </label>
                <button class="theme-toggle" id="themeToggle" title="Тема">🌙</button>
            </div>
        </header>

        <div class="calendar" id="calendar"></div>

        <div class="progress-container">
            <div class="progress-header" id="progressHeader">
                <span>Прогресс</span>
                <span id="progressText">0 / 0</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-row">
                <input type="text" id="habitInput" placeholder="Что нужно сделать?">
                <input type="time" id="habitTime" title="Время">
            </div>
            <div class="color-picker" id="colorPicker">
                <div class="color-dot active" style="background: #8b5cf6;" data-color="#8b5cf6"></div>
                <div class="color-dot" style="background: #22d3ee;" data-color="#22d3ee"></div>
                <div class="color-dot" style="background: #f59e0b;" data-color="#f59e0b"></div>
                <div class="color-dot" style="background: #ec4899;" data-color="#ec4899"></div>
                <div class="color-dot" style="background: #3b82f6;" data-color="#3b82f6"></div>
            </div>
            <button class="btn-add" id="addBtn">Добавить</button>
        </div>

        <div class="habits-list" id="habitsList"></div>

        <div class="footer-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Свайп влево или ✕ для удаления
        </div>
    </div>

    <script>
        let habits = JSON.parse(localStorage.getItem('myHabits')) || [];
        let selectedColor = '#8b5cf6'; 
        let editSelectedColor = '#8b5cf6';
        let editingHabitId = null;
        
        function getLocalDateString(d = new Date()) {
            const offset = d.getTimezoneOffset();
            const localD = new Date(d.getTime() - (offset * 60 * 1000));
            return localD.toISOString().split('T')[0];
        }

        let selectedDate = getLocalDateString(); 
        let confettiFired = false; 
        
        const alarmOverlay = document.getElementById('alarmOverlay');
        const alarmTaskText = document.getElementById('alarmTaskText');
        const stopAlarmBtn = document.getElementById('stopAlarmBtn');
        
        const editOverlay = document.getElementById('editOverlay');
        const editTextInput = document.getElementById('editTextInput');
        const editTimeInput = document.getElementById('editTimeInput');
        const editColorPicker = document.getElementById('editColorPicker');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const saveEditBtn = document.getElementById('saveEditBtn');
        
        let activeAlarmHabitId = null; 

        function vibrate() { if ("vibrate" in navigator) navigator.vibrate(50); }

        let audioCtx;
        let alarmInterval;

        function unlockAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        document.body.addEventListener('click', unlockAudioContext);
        document.body.addEventListener('touchstart', unlockAudioContext);

        function startAlarmSound() {
            unlockAudioContext();
            if (alarmInterval) clearInterval(alarmInterval);
            alarmInterval = setInterval(() => {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square'; 
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }, 500);
        }

        function stopAlarmSound() {
            if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
        }

        document.getElementById('colorPicker').addEventListener('click', (e) => {
            if (e.target.classList.contains('color-dot')) {
                document.querySelectorAll('#colorPicker .color-dot').forEach(dot => dot.classList.remove('active'));
                e.target.classList.add('active');
                selectedColor = e.target.getAttribute('data-color');
                vibrate();
            }
        });

        editColorPicker.addEventListener('click', (e) => {
            if (e.target.classList.contains('color-dot')) {
                document.querySelectorAll('#editColorPicker .color-dot').forEach(dot => dot.classList.remove('active'));
                e.target.classList.add('active');
                editSelectedColor = e.target.getAttribute('data-color');
                vibrate();
            }
        });

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            document.getElementById('themeToggle').textContent = '☀️';
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            vibrate();
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('themeToggle').textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            vibrate();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(habits));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "tasks_backup_" + getLocalDateString() + ".json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        });

        document.getElementById('importBtn').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedHabits = JSON.parse(e.target.result);
                    if (Array.isArray(importedHabits)) {
                        if (confirm('Вы уверены? Текущие данные будут заменены.')) {
                            habits = importedHabits;
                            saveData(); renderCalendar(); renderHabits();
                            alert('Данные успешно восстановлены!');
                        }
                    } else { alert('Ошибка: неверный формат файла.'); }
                } catch (err) { alert('Ошибка при чтении файла.'); }
            };
            reader.readAsText(file);
            this.value = ''; 
        });

        function renderCalendar() {
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';
            const today = new Date();
            for (let i = 0; i < 7; i++) {
                let d = new Date(today);
                d.setDate(today.getDate() + i);
                let dateStr = getLocalDateString(d);
                
                let dayName = d.toLocaleDateString('ru-RU', { weekday: 'short' });
                let dayNum = d.getDate();

                let btn = document.createElement('button');
                btn.className = `day-btn ${dateStr === selectedDate ? 'active' : ''}`;
                btn.innerHTML = `<span class="day-name">${dayName}</span><span class="day-num">${dayNum}</span>`;
                
                btn.addEventListener('click', () => {
                    vibrate();
                    selectedDate = dateStr;
                    confettiFired = false; 
                    renderCalendar(); updateDateLabel(); renderHabits(); 
                });
                calendar.appendChild(btn);
            }
        }

        function updateDateLabel() {
            const parts = selectedDate.split('-');
            const localDate = new Date(parts[0], parts[1] - 1, parts[2]);
            document.getElementById('currentDateLabel').textContent = localDate.toLocaleDateString('ru-RU', { month: 'long', day: 'numeric' });
        }

        function saveData() { localStorage.setItem('myHabits', JSON.stringify(habits)); }

        function renderHabits() {
            const list = document.getElementById('habitsList');
            list.innerHTML = '';
            const filtered = habits.filter(h => h.date === selectedDate);
            const now = new Date();
            const currentTime = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state">На этот день задач нет. Добавьте первую! 👇</div>';
            }

            filtered.forEach(habit => {
                const isOverdue = !habit.completed && selectedDate === getLocalDateString() && habit.time && habit.time < currentTime;

                const card = document.createElement('div');
                card.className = `habit-card ${habit.completed ? 'completed' : ''} ${isOverdue ? 'overdue' : ''}`;
                card.id = `habit-${habit.id}`;
                card.style.setProperty('--custom-color', habit.color || '#8b5cf6');

                const deleteLayer = document.createElement('div');
                deleteLayer.className = 'delete-layer';
                deleteLayer.innerHTML = 'УДАЛИТЬ 🗑️';

                const frontLayer = document.createElement('div');
                frontLayer.className = 'habit-front';

                const content = document.createElement('div');
                content.className = 'habit-content';

                const titleRow = document.createElement('div');
                titleRow.className = 'habit-title-row';

                const checkBtn = document.createElement('button');
                checkBtn.className = 'check-btn';
                
                const span = document.createElement('span');
                span.className = 'habit-text';
                span.textContent = habit.text;

                const actionsContainer = document.createElement('div');
                actionsContainer.className = 'card-actions';

                const editBtn = document.createElement('button');
                editBtn.className = 'btn-icon edit';
                editBtn.innerHTML = '✏️';
                editBtn.title = 'Редактировать';
                editBtn.onclick = (e) => {
                    e.stopPropagation();
                    vibrate();
                    openEditModal(habit.id);
                };

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-icon delete';
                deleteBtn.innerHTML = '✕';
                deleteBtn.title = 'Удалить';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    vibrate();
                    deleteHabit(habit.id, card);
                };

                actionsContainer.appendChild(editBtn);
                actionsContainer.appendChild(deleteBtn);

                titleRow.appendChild(checkBtn);
                titleRow.appendChild(span);
                titleRow.appendChild(actionsContainer);
                content.appendChild(titleRow);

                if (habit.time) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'habit-time';
                    if (isOverdue) {
                        timeSpan.innerHTML = `⚠️ ПРОСРОЧЕНО (${habit.time})`;
                        timeSpan.classList.add('overdue');
                    } else {
                        timeSpan.innerHTML = `⏰ В ${habit.time}`;
                    }
                    content.appendChild(timeSpan);
                }

                frontLayer.appendChild(content);
                card.appendChild(deleteLayer);
                card.appendChild(frontLayer);

                checkBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    vibrate(); 
                    habit.completed = !habit.completed;
                    if (!habit.completed) habit.notified = false; 
                    saveData(); renderHabits();
                });

                let startX = 0, currentX = 0;
                frontLayer.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX; currentX = startX; frontLayer.style.transition = 'none';
                }, { passive: true });
                
                frontLayer.addEventListener('touchmove', (e) => {
                    currentX = e.touches[0].clientX;
                    let diff = currentX - startX;
                    if (diff < 0 && diff > -150) frontLayer.style.transform = `translateX(${diff}px)`;
                }, { passive: true });
                
                frontLayer.addEventListener('touchend', () => {
                    frontLayer.style.transition = 'transform 0.3s ease, background 0.3s ease';
                    let diff = currentX - startX;
                    if (diff < -100) {
                        vibrate(); 
                        deleteHabit(habit.id, card);
                    } else { frontLayer.style.transform = `translateX(0)`; }
                });

                list.appendChild(card);
            });
            updateProgress(filtered);
        }

        function deleteHabit(id, cardElement) {
            cardElement.style.transition = 'all 0.3s ease';
            cardElement.style.transform = 'translateX(-100%)'; cardElement.style.opacity = '0';
            setTimeout(() => {
                habits = habits.filter(h => h.id !== id);
                saveData(); renderHabits();
            }, 300);
        }

        function openEditModal(id) {
            const habit = habits.find(h => h.id === id);
            if (!habit) return;
            editingHabitId = id;
            editTextInput.value = habit.text;
            editTimeInput.value = habit.time || '';
            editSelectedColor = habit.color || '#8b5cf6';
            document.querySelectorAll('#editColorPicker .color-dot').forEach(dot => {
                dot.classList.toggle('active', dot.getAttribute('data-color') === editSelectedColor);
            });
            editOverlay.classList.add('show');
        }

        cancelEditBtn.addEventListener('click', () => {
            vibrate();
            editOverlay.classList.remove('show');
            editingHabitId = null;
        });

        saveEditBtn.addEventListener('click', () => {
            vibrate();
            const newText = editTextInput.value.trim();
            if (newText === '') {
                alert('Текст задачи не может быть пустым!');
                return;
            }
            const habit = habits.find(h => h.id === editingHabitId);
            if (habit) {
                habit.text = newText;
                habit.time = editTimeInput.value;
                habit.color = editSelectedColor;
                if (habit.time !== editTimeInput.value) habit.notified = false;
                saveData(); renderHabits();
            }
            editOverlay.classList.remove('show');
            editingHabitId = null;
        });

        function updateProgress(filteredHabits) {
            const total = filteredHabits.length;
            const completed = filteredHabits.filter(h => h.completed).length;
            const progressHeader = document.getElementById('progressHeader');
            const progressText = document.getElementById('progressText');
            
            if (total > 0 && completed === total) {
                progressText.textContent = "Все выполнено! 🎉";
                progressHeader.classList.add('completed-text');
                if (!confettiFired) {
                    triggerConfetti();
                    confettiFired = true;
                    if("vibrate" in navigator) setTimeout(() => navigator.vibrate(50), 100);
                }
            } else {
                progressText.textContent = `${completed} / ${total}`;
                progressHeader.classList.remove('completed-text');
                confettiFired = false; 
            }
            document.getElementById('progressFill').style.width = total === 0 ? '0%' : `${(completed / total) * 100}%`;
        }

        function triggerConfetti() {
            var duration = 2000; var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#8b5cf6', '#22d3ee', '#10b981'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#8b5cf6', '#22d3ee', '#10b981'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function addNewHabit() {
            const input = document.getElementById('habitInput');
            const timeInput = document.getElementById('habitTime');
            const text = input.value.trim();
            
            if (text !== '') {
                if (timeInput.value && "Notification" in window && Notification.permission === "default") {
                    Notification.requestPermission();
                }
                vibrate();
                habits.push({
                    id: Date.now(), text: text, time: timeInput.value,
                    date: selectedDate, completed: false, notified: false, color: selectedColor 
                });
                input.value = ''; timeInput.value = '';
                saveData(); renderHabits();
            }
        }

        document.getElementById('addBtn').addEventListener('click', addNewHabit);
        document.getElementById('habitInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addNewHabit();
        });

        setInterval(() => {
            const now = new Date();
            const currentTime = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            const todayStr = getLocalDateString();
            let needsRender = false;

            habits.forEach(habit => {
                if (!habit.time || habit.date !== todayStr || habit.completed || habit.notified) return;
                let [hHours, hMins] = habit.time.split(':').map(Number);
                let [cHours, cMins] = currentTime.split(':').map(Number);
                let hTotal = hHours * 60 + hMins;
                let cTotal = cHours * 60 + cMins;
                let diffMins = cTotal - hTotal;

                if (diffMins >= 0 && diffMins <= 1) {
                    habit.notified = true; needsRender = true;
                    activeAlarmHabitId = habit.id; startAlarmSound(); 
                    if (Notification.permission === "granted") {
                        new Notification("Пора выполнить задачу!", { body: habit.text });
                    }
                    alarmTaskText.textContent = habit.text;
                    alarmOverlay.classList.add('show');
                    saveData();
                } 
                else if (diffMins > 1) {
                    habit.notified = true; saveData(); needsRender = true;
                }
            });
            if (needsRender) renderHabits();
        }, 10000); 

        stopAlarmBtn.addEventListener('click', () => {
            vibrate();
            stopAlarmSound(); 
            alarmOverlay.classList.remove('show');
            if (activeAlarmHabitId) {
                let habit = habits.find(h => h.id === activeAlarmHabitId);
                if (habit) { habit.completed = true; saveData(); renderHabits(); }
                activeAlarmHabitId = null;
            }
        });

        renderCalendar(); updateDateLabel(); renderHabits();
    </script>

    <!-- РЕГИСТРАЦИЯ PWA (Service Worker) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('PWA готово!'))
                    .catch(err => console.log('Ошибка PWA:', err));
            });
        }
    </script>
</body>
